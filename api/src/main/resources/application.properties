spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

spring.flyway.baseline-on-migrate=true

spring.jackson.serialization.write-dates-as-timestamps=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=16MB

spring.task.scheduling.pool.size=4

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

app.upload.dir=uploads/photos

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS}

app.security.google.client-id=${GOOGLE_CLIENT_ID}

app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Comma-separated CIDR ranges of reverse proxies allowed to set X-Forwarded-For. Empty = always trust the socket peer.
app.security.trusted-proxies=${TRUSTED_PROXIES:}

# Enable only behind TLS termination (production). When true every request must arrive over HTTPS.
app.security.require-https=${REQUIRE_HTTPS:false}

app.officialdata.joinville.base-url=https://www.joinville.sc.gov.br/index.php/wp-json/wp/v2/noticia

app.officialdata.cemaden.catalog-url=https://resources.cemaden.gov.br/dados/311_24.json
app.officialdata.cemaden.readings-url=https://resources.cemaden.gov.br/graficos/interativo/getJson2.php
app.officialdata.cemaden.state=SC
app.officialdata.cemaden.city-ibge-code=4209102

# Limiares = limite inferior das faixas amarelo/laranja/vermelho do aviso de "chuvas intensas" do INMET (Alert-AS). Ver api/todo.md.
app.officialdata.rain.last-hour.attention=20.0
app.officialdata.rain.last-hour.alert=30.0
app.officialdata.rain.last-hour.critical=60.0
app.officialdata.rain.last24-hours.attention=30.0
app.officialdata.rain.last24-hours.alert=50.0
app.officialdata.rain.last24-hours.critical=100.0
app.officialdata.rain.river-attention-ratio=2.0
app.officialdata.rain.river-alert-ratio=3.0
# Raio (km) em torno do centroide da zona para atribuir um pluviometro do CEMADEN; fora disso, cai na zona mais proxima
app.officialdata.rain.station-radius-km=5.0

app.officialdata.worldtides.base-url=https://www.worldtides.info/api/v3
app.officialdata.worldtides.key=${WORLDTIDES_API_KEY:}
app.officialdata.worldtides.lat=-26.2439
app.officialdata.worldtides.lon=-48.6386

app.officialdata.openmeteo.base-url=https://api.open-meteo.com/v1/forecast
app.officialdata.openmeteo.flood-url=https://flood-api.open-meteo.com/v1/flood

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s

app.push.enabled=${PUSH_ENABLED:false}
app.push.vapid.public-key=${VAPID_PUBLIC_KEY:}
app.push.vapid.private-key=${VAPID_PRIVATE_KEY:}
app.push.vapid.subject=${VAPID_SUBJECT:mailto:contato@alagou.app}
app.push.send-batch-size=100
app.push.subscription-page-size=500
app.push.daily-cap=15
app.push.climatic-cooldown-minutes=60
app.push.outbox-relay-ms=5000
app.push.max-attempts=5
app.push.send-concurrency=8
app.push.outbox-claim-size=50
