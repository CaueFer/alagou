services:
  db:
    image: postgis/postgis:16-3.4
    container_name: alagou-db
    environment:
      POSTGRES_DB: alagou
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - alagou_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alagou"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  alagou_db_data:
