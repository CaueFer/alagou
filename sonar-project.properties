sonar.java.source=21
sonar.java.binaries=api/target/classes
sonar.java.test.binaries=api/target/test-classes

sonar.coverage.jacoco.xmlReportPaths=api/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=app/coverage/lcov.info
sonar.coverage.exclusions=app/src/components/**,app/src/screens/**,app/src/main.tsx,app/src/App.tsx,app/src/sw.ts

sonar.qualitygate.wait=true
