sonar.projectKey=CaueFer_alagou
sonar.organization=cauefer
sonar.projectName=Alagou
sonar.sourceEncoding=UTF-8

sonar.sources=api/src/main,app/src
sonar.tests=api/src/test,app/src
sonar.test.inclusions=api/src/test/**,app/src/**/*.test.ts,app/src/**/*.test.tsx
