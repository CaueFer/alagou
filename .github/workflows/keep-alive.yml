name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    if: vars.API_URL != ''
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.API_URL }}/api/health"
