# To make it block merges, mark the "CI passed" check as required in
# GitHub → Settings → Branches → Branch protection rules for `main`.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

# Cancel superseded runs on the same PR / branch.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test and enforce coverage
        run: mvn -B -ntp clean verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: api/target/surefire-reports
          retention-days: 7

      - name: Upload analysis inputs
        uses: actions/upload-artifact@v7
        with:
          name: backend-analysis
          path: |
            api/target/classes
            api/target/test-classes
            api/target/site/jacoco/jacoco.xml
          retention-days: 1

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload analysis inputs
        uses: actions/upload-artifact@v7
        with:
          name: frontend-analysis
          path: app/coverage/lcov.info
          retention-days: 1

  sonar:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      # Secrets are not exposed to fork PRs, and the job must not fail for those.
      - name: Report skipped analysis
        if: env.SONAR_TOKEN == ''
        run: echo "::warning title=SonarQube skipped::SONAR_TOKEN is not available to this run."

      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0

      - name: Download backend analysis inputs
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: backend-analysis
          path: api/target

      - name: Download frontend analysis inputs
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: frontend-analysis
          path: app/coverage

      - name: Scan and wait for quality gate
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.4.1

  # Single stable status check to require in branch protection.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [backend, frontend, sonar]
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          if echo "${{ join(needs.*.result, ',') }}" | grep -qE 'failure|cancelled'; then
            echo "One or more CI jobs did not pass."
            exit 1
          fi
          echo "All CI jobs passed."
